[package]
name = "firmware"
version = "0.1.0"
authors = ["Scott Mabin <scott@mabez.dev>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos  = { version = "0.4",  features = ["esp32s3", "embassy"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }

log = { version = "0.4" }
static_cell = { version = "2", features = ["nightly"] }
embedded-graphics-core = "0.4.1"
critical-section = "1"
esp32s3 = "0.36.0"
embedded-hal = "1"

embassy-time = { version = "0.5" }
embassy-executor = { version = "0.10" }
embassy-usb = { version = "0.6", default-features = false, features = ["usbd-hid"] }
usbd-hid = "0.10.2"
embassy-futures = "0.1"
embassy-sync = "0.8"

tinygif = "0.0.4"
embedded-graphics = "0.8.2"

[features]
default = ["log"]
usb-pin-exchange = []
debug-matrix = []
log = []
defmt = []

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
